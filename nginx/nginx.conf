# ============================================================
# Nginx Configuration - EkoService Frontend
# ───────────────────────────────────────────────────────────
# Features:
#   - SPA fallback (try_files)
#   - Security headers (HSTS, CSP, X-Frame, etc.)
#   - Gzip compression
#   - Static asset caching
#   - Reverse proxy ke backend API
#   - Rate limiting
# ============================================================

# Worker processes
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ──────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
 '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Performance ──────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  keepalive_requests1000;
  types_hash_max_size 2048;

  # ── Gzip Compression ─────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2;

  # ── Rate Limiting ───────────────────────────────────
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

  # ── Server Block ────────────────────────────────────
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"    always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;

    # Content Security Policy (strict)
    add_header Content-Security-Policy "
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: blob:;
      connect-src 'self' https: wss:;
      frame-src 'none';
      object-src 'none';
      form-action 'self';
    " always;

    # ── Health check endpoint ───────────────────────────
    location /health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # ── API Proxy ──────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_set_header   Connection        "";

      proxy_connect_timeout 10s;
      proxy_send_timeout    30s;
      proxy_read_timeout    30s;

      # Buffering
      proxy_buffering on;
      proxy_buffer_size  4k;
      proxy_buffers 8 4k;
    }

    # ── Auth routes (tighter rate limit) ──────────────
    location /api/auth/login,
 /api/auth/register {
      limit_req zone=auth burst=3 nodelay;

      proxy_pass         http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $request_id;
      proxy_set_header   Connection        "";
    }

    # ── Static Assets (Cached) ─────────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|otf)$ {
      expires1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ── HTML (No cache) ────────────────────────────────
    location ~* \.html$ {
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── SPA Fallback ──────────────────────────────────
    location / {
      try_files $uri $uri/ /index.html;
 }

    # ── Error pages ───────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }
  }
}