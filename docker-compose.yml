# ============================================================
# EkoService - Docker Compose (Production-Ready)
# ───────────────────────────────────────────────────────────
# Services:
#   postgres   - PostgreSQL 16 database
#   redis      - Redis 7 (cache + queue)
#   backend   - Fastify API (Node 20)
#   frontend  - Vite React SPA (Nginx)
# ───────────────────────────────────────────────────────────
# Usage:
#   Development: docker compose up -d
#   Production:  docker compose -f docker-compose.yml -p ekoservice up -d
# ============================================================

services:
  # ── PostgreSQL 16 ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ekoservice_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eko_service
      POSTGRES_USER: ${POSTGRES_USER:-eko_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eko_pass_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/prisma/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eko_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ekoservice
    # resources:
    #   limits:
    #     cpus: '1.0'
    #     memory: 1G

  # ── Redis 7 ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ekoservice_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_pass_prod}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ekoservice

  # ── Backend API ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ekoservice_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eko_service}:${POSTGRES_PASSWORD:-eko_pass_prod}@postgres:5432/eko_service
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_prod}@redis:6379/0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ekoservice

  # ── Frontend SPA ───────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ekoservice_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=${APP_API_URL:-http://localhost:3000}
      - VITE_API_KEY=${API_KEY:-dev_api_key}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ekoservice

# ── Volumes ──────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

# ── Network ─────────────────────────────────────────────

networks:
  ekoservice:
    driver: bridge
    name: ekoservice_network
